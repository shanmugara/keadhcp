<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kea DHCP{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --kea-bg:          #f5f6fa;
      --kea-border:      #e7e8f0;
      --kea-text-muted:  #6b7086;
      --kea-accent:      #4f56e0;
      --kea-accent-dark: #3d43b8;
      --kea-radius:      .65rem;
      --kea-radius-sm:   .5rem;
      --kea-shadow-sm:   0 1px 2px rgba(16,24,40,.06);
      --kea-shadow:      0 4px 12px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.04);
      --kea-shadow-lg:   0 16px 32px rgba(16,24,40,.16);

      /* Retint Bootstrap's primary utility classes (bg-primary, text-primary,
         badge bg-primary, …) to match the sidebar/stat-card accent. Bootstrap
         components like .btn-primary use fixed hex, not these vars, so they
         get their own override below. */
      --bs-primary:     var(--kea-accent);
      --bs-primary-rgb: 79, 86, 224;
    }

    body { background: var(--kea-bg); color: #1c2030; }

    /* ── Unify accent color (Bootstrap ships .btn-primary etc. with fixed
       hex per-component vars, so retinting --bs-primary above doesn't
       reach them) ── */
    .btn-primary {
      --bs-btn-bg: var(--kea-accent);
      --bs-btn-border-color: var(--kea-accent);
      --bs-btn-hover-bg: var(--kea-accent-dark);
      --bs-btn-hover-border-color: var(--kea-accent-dark);
      --bs-btn-active-bg: var(--kea-accent-dark);
      --bs-btn-active-border-color: var(--kea-accent-dark);
      --bs-btn-disabled-bg: var(--kea-accent);
      --bs-btn-disabled-border-color: var(--kea-accent);
      --bs-btn-focus-shadow-rgb: 79, 86, 224;
    }
    .btn-outline-primary {
      --bs-btn-color: var(--kea-accent);
      --bs-btn-border-color: var(--kea-accent);
      --bs-btn-hover-bg: var(--kea-accent);
      --bs-btn-hover-border-color: var(--kea-accent);
      --bs-btn-active-bg: var(--kea-accent);
      --bs-btn-active-border-color: var(--kea-accent);
      --bs-btn-disabled-color: var(--kea-accent);
      --bs-btn-disabled-border-color: var(--kea-accent);
      --bs-btn-focus-shadow-rgb: 79, 86, 224;
    }
    .form-check-input:checked {
      background-color: var(--kea-accent);
      border-color: var(--kea-accent);
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 232px;
      min-height: 100vh;
      height: 100vh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      background: linear-gradient(180deg, #14161f 0%, #1b1e2c 100%);
      flex-shrink: 0;
    }
    #sidebar .brand {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .01em;
      color: #fff;
      padding: 1.35rem 1.25rem;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    #sidebar .brand i { color: var(--kea-accent); font-size: 1.2rem; }
    #sidebar .nav-link {
      color: #aeb2c8;
      font-size: .89rem;
      font-weight: 500;
      padding: .6rem .9rem;
      border-radius: var(--kea-radius-sm);
      margin: 2px 10px;
      display: flex;
      align-items: center;
      transition: background .15s ease, color .15s ease;
    }
    #sidebar .nav-link:hover { background: rgba(255,255,255,.07); color: #fff; }
    #sidebar .nav-link.active {
      background: rgba(79,86,224,.22);
      color: #fff;
      box-shadow: inset 3px 0 0 var(--kea-accent);
    }
    #sidebar .nav-link i { margin-right: 10px; width: 1.1rem; text-align: center; }

    /* ── Main content ── */
    #main { flex: 1; overflow-x: hidden; }
    .page-header {
      background: #fff;
      border-bottom: 1px solid var(--kea-border);
      padding: 1rem 1.75rem;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .page-header h5 { font-weight: 700; font-size: 1.15rem; color: #1a1d2b; }
    .content-area { padding: 1.5rem 1.75rem; }

    /* ── Cards / buttons / forms (shared polish) ── */
    .card {
      border: 1px solid var(--kea-border);
      box-shadow: var(--kea-shadow-sm);
      border-radius: var(--kea-radius);
    }
    .btn { border-radius: var(--kea-radius-sm); }
    .form-control, .form-select {
      border-radius: var(--kea-radius-sm);
      border-color: var(--kea-border);
    }
    .form-control:focus, .form-select:focus {
      border-color: #b9bdf2;
      box-shadow: 0 0 0 .2rem rgba(79,86,224,.15);
    }
    .input-group-text { border-color: var(--kea-border); background: #f8f9fc; }
    .dropdown-menu {
      border: 1px solid var(--kea-border);
      border-radius: var(--kea-radius-sm);
      box-shadow: var(--kea-shadow-lg);
    }
    .modal-content {
      border: none;
      border-radius: var(--kea-radius);
      box-shadow: var(--kea-shadow-lg);
    }
    .alert { border-radius: var(--kea-radius-sm); border: none; }

    /* ── Stat cards ── */
    .stat-card {
      background: #fff;
      border: 1px solid var(--kea-border);
      border-radius: var(--kea-radius);
      box-shadow: var(--kea-shadow-sm);
      padding: 1rem 1.15rem;
      display: flex;
      align-items: center;
      gap: .9rem;
      height: 100%;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--kea-shadow); }
    .stat-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .stat-value { font-size: 1.5rem; font-weight: 700; line-height: 1.1; color: #1a1d2b; }
    .stat-label { font-size: .78rem; color: var(--kea-text-muted); font-weight: 500; }
    .stat-card-primary   .stat-icon { background: #eef0fd; color: var(--kea-accent); }
    .stat-card-success   .stat-icon { background: #e7f7ee; color: #1f9d55; }
    .stat-card-danger    .stat-icon { background: #fdecec; color: #e13c3c; }
    .stat-card-info      .stat-icon { background: #e8f4fb; color: #1f8fc4; }
    .stat-card-secondary .stat-icon { background: #eef0f3; color: #5b6072; }

    /* ── Filter bar ── */
    .filter-bar {
      background: #fff;
      border: 1px solid var(--kea-border);
      border-radius: var(--kea-radius);
      box-shadow: var(--kea-shadow-sm);
      padding: .9rem 1rem;
    }

    /* ── Tables ── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--kea-border);
      border-radius: var(--kea-radius);
      box-shadow: var(--kea-shadow-sm);
    }
    .kea-table thead th {
      background: #f8f9fc;
      color: #495164;
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .045em;
      border-bottom: 2px solid var(--kea-border);
      white-space: nowrap;
    }
    .kea-table tbody tr:hover { background: #f5f6fb; }
    th a { color: inherit; text-decoration: none; white-space: nowrap; }
    th a:hover { text-decoration: underline; }
    .badge-expired, .badge-active {
      font-weight: 600;
      font-size: .72rem;
      padding: .35em .65em;
      border-radius: 999px;
    }
    .badge-expired { background: #fdecec; color: #c22a2a; }
    .badge-active  { background: #e7f7ee; color: #1a7a41; }
    tr.expired-row td { color: #9095ab; }
    .sort-icon { font-size: .75rem; margin-left: 2px; }

    /* ── Log viewer ── */
    #log-output {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: .8rem;
      white-space: pre-wrap;
      word-break: break-all;
      height: 72vh;
      overflow-y: auto;
      padding: 1rem;
      border-radius: var(--kea-radius);
    }
    .log-error  { color: #ff7b72; }
    .log-warn   { color: #e3b341; }
    .log-info   { color: #7ee787; }
    .log-debug  { color: #6e9ef1; }
    .log-line:hover { background: rgba(255,255,255,.05); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<div class="d-flex">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="brand">
      <i class="bi bi-hdd-network me-2"></i>Kea DHCP
    </div>
    <ul class="nav flex-column mt-2">
      <li class="nav-item">
        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="/">
          <i class="bi bi-house"></i> Home
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active_page == 'leases' %}active{% endif %}" href="/leases">
          <i class="bi bi-table"></i> Leases
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active_page == 'reservations' %}active{% endif %}" href="/reservations">
          <i class="bi bi-bookmark-star"></i> Reservations
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link {% if active_page == 'logs' %}active{% endif %}" href="/logs">
          <i class="bi bi-journal-text"></i> Logs
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main -->
  <div id="main">
    <div class="page-header d-flex align-items-center justify-content-between">
      <h5 class="mb-0">{% block page_title %}{% endblock %}</h5>
      <span class="text-muted small">{% block page_subtitle %}{% endblock %}</span>
    </div>

    <div class="content-area">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
